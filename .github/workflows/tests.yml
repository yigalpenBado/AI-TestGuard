# Tests rapides : exécutés à chaque Pull Request et à chaque envoi sur main.
# Le jeu de données n'est pas disponible ici : les tests qui en ont besoin sont ignorés,
# tous les autres utilisent des données synthétiques (tests/conftest.py).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ruff + Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Vérification du style (Ruff)
        run: ruff check . --output-format=github

      - name: Tests (Pytest + couverture)
        run: pytest --cov-report=xml:reports/coverage.xml

      - name: Résumé des tests et de la couverture
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import xml.etree.ElementTree as ET
          suite = ET.parse("reports/junit.xml").getroot().find("testsuite")
          total, echecs = int(suite.get("tests")), int(suite.get("failures")) + int(suite.get("errors"))
          ignores = int(suite.get("skipped"))
          statut = "✅ Tous les tests sont passés" if echecs == 0 else f"❌ {echecs} test(s) en échec"
          print(f"## {statut}\n")
          print(f"| Total | Réussis | Échecs | Ignorés |\n|---|---|---|---|")
          print(f"| {total} | {total - echecs - ignores} | {echecs} | {ignores} |\n")
          EOF
          echo "## Couverture du code" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Publication des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/coverage/
